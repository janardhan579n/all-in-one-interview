# Serves the built SPA and proxies the API, so the browser only ever talks to one origin.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; index.html must never be cached or a deploy
    # can leave a browser loading a chunk that no longer exists.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The API is optional. If the backend container is not running, these 502 and the
    # frontend falls back to offline mode on its own (services/platform.ts).
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Client-side routing: every unknown path is a React route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
